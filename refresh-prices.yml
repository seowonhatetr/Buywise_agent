name: Refresh prices
on:
  schedule:
    - cron: '0 2 * * 1'   # weekly (Monday 02:00 UTC) to save SerpApi credits
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/refresh-prices.js
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add public/prices.json
          git diff --cached --quiet || (git commit -m "Refresh prices" && git push)
